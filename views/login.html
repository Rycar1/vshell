<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VShell Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #1a1a2e; border-radius: 12px; padding: 40px; width: 380px; border: 1px solid #2a2a4a; }
        .login-box h1 { color: #fff; font-size: 24px; margin-bottom: 8px; text-align: center; }
        .login-box p { color: #888; font-size: 14px; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #4a6cf7; }
        .btn { width: 100%; padding: 10px; background: #4a6cf7; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }
        .btn:hover { background: #3b5de7; }
        .error { color: #ff4757; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>管理平台</h1>
        <p>VShell Management Console</p>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" value="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">
                <span class="loading" id="loadingSpinner"></span>
                Sign In
            </button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loadingSpinner');
            const error = document.getElementById('errorMsg');
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            error.style.display = 'none';
            try {
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const d = await r.json();
                if (d.code === 0) {
                    const token = d.result && d.result.token ? d.result.token : d.token;
                    localStorage.setItem('token', token);
                    window.location.href = '/dashboard';
                } else {
                    error.textContent = d.message || 'Login failed';
                    error.style.display = 'block';
                }
            } catch (e) {
                error.textContent = 'Connection error';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
